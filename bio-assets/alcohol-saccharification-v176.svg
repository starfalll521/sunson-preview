<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Saccharification and fermentation</title><desc id="desc">Glucoamylase releases glucose from starch-derived chains. Yeast then ferments sugar to ethanol. The two catalytic roles are distinct.</desc><rect width="720" height="420" fill="#e2e9ec"/><g fill="none" stroke="#385762" stroke-width="2"><path d="M42 181h92m-92 35h54m-54 35h92M181 216h65m-12-11 12 11-12 11M431 216h65m-12-11 12 11-12 11"/><circle cx="311" cy="180" r="12"/><circle cx="361" cy="180" r="12"/><circle cx="311" cy="225" r="12"/><circle cx="361" cy="225" r="12"/><path d="M552 132h96v114c0 25-21 45-48 45s-48-20-48-45V132Zm-9 0h114m-57-39v39m-26 62h52m-52 24h52m-52 24h52"/></g><g fill="#a74732"><circle cx="600" cy="177" r="4"/><circle cx="582" cy="268" r="4"/></g><g fill="#283b42" font-family="Arial,sans-serif" text-anchor="middle"><text x="87" y="93" font-size="21">Dextrins</text><text x="336" y="93" font-size="21">Glucose</text><text x="600" y="326" font-size="21">Ethanol</text><text x="211" y="159" font-size="14">Glucoamylase</text><text x="464" y="159" font-size="14">Yeast</text><text x="360" y="377" font-size="13">Saccharification releases sugar · fermentation converts it</text></g></svg>
